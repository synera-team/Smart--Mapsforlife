# Fly.io config for the M4L 2.0 DEMO (staging). Deploy from the repo root:
#   fly deploy . --config deploy/demo/fly.toml --dockerfile deploy/demo/Dockerfile
# One machine only: the demo uses SQLite on a single volume.
app = "xanh24-m4l-demo"
primary_region = "sin"

[env]
  WORKERS = "2"

[mounts]
  source = "m4l_demo_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
