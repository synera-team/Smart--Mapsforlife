<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12396b">
  <title>Khám phá · Xanh24 Maps for Life</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/user/user.css">
</head>
<body>
  <div id="app" class="user-app">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/dashboard/user#discover" aria-label="Xanh24 - Trang khám phá"><img src="/assets/logo.png" alt="Xanh24"><span>Maps for Life</span></a>
        <form id="searchForm" class="header-search" role="search"><span id="searchIcon"></span><input id="searchInput" type="search" placeholder="Tìm địa điểm, khu vực..." aria-label="Tìm địa điểm"><button type="submit">Tìm kiếm</button></form>
        <nav class="header-nav" aria-label="Điều hướng chính">
          <a href="#discover" data-nav="discover">Khám phá</a>
          <a href="#saved" data-nav="saved">Đã lưu</a>
          <a href="/?mode=web">Bản đồ</a>
        </nav>
        <a class="account-link" href="#profile" data-nav="profile"><span id="avatar">U</span><span id="accountName">Tài khoản</span></a>
      </div>
    </header>
    <main id="view" class="view"><div class="loading">Đang tải địa điểm...</div></main>
    <footer class="site-footer"><span>Xanh24 · Maps for Life</span><a href="/?mode=web">Mở bản đồ</a></footer>
    <nav class="mobile-nav" aria-label="Điều hướng trên điện thoại">
      <a href="#discover" data-nav="discover"><span data-icon="compass"></span>Khám phá</a>
      <a href="/?mode=web"><span data-icon="map"></span>Bản đồ</a>
      <a href="#saved" data-nav="saved"><span data-icon="star"></span>Đã lưu</a>
      <a href="#profile" data-nav="profile"><span data-icon="user"></span>Cá nhân</a>
    </nav>
  </div>
  <dialog id="placeDialog" class="place-dialog" aria-label="Chi tiết địa điểm"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/user/user.js"></script>
</body>
</html>
