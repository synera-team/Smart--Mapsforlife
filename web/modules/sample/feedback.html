<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phản ánh – Góp ý</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#F3F6FA;color:#13223F}
.wrap{max-width:760px;margin:0 auto;padding:24px}
h2{color:#14346F;margin:0 0 6px}p{color:#5B6B85;margin:0 0 18px}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
select,textarea,input{width:100%;font:inherit;padding:14px;border-radius:14px;border:1.5px solid #D5DEEB;background:#fff;box-sizing:border-box}
textarea{min-height:140px;resize:vertical}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{height:46px;padding:0 16px;border-radius:999px;border:1.5px solid #D5DEEB;background:#fff;font:inherit;font-weight:600;cursor:pointer}
.topics button.on{background:#14346F;color:#fff;border-color:#14346F}
.send{margin-top:18px;height:56px;width:100%;border:0;border-radius:16px;background:linear-gradient(120deg,#2A62B8,#22C98A);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.ok{padding:18px;border-radius:16px;background:#E9F8F1;color:#17A673;font-weight:700;margin-top:14px;display:none}
</style></head>
<body><div class="wrap">
<h2>Phản ánh – Góp ý</h2>
<p>Module mẫu minh hoạ cổng mở rộng: dữ liệu gửi về API <code>/api/modules/feedback</code> của máy chủ.</p>
<label>Chủ đề</label>
<div class="topics" id="topics"><button class="on">Hạ tầng – Giao thông</button><button>Vệ sinh môi trường</button><button>Thủ tục hành chính</button><button>Khác</button></div>
<label for="c">Nội dung</label><textarea id="c" placeholder="Mô tả ngắn gọn vấn đề…"></textarea>
<label for="ct">Liên hệ (không bắt buộc)</label><input id="ct" placeholder="Số điện thoại hoặc email">
<button class="send" id="send">Gửi phản ánh</button>
<div class="ok" id="ok">Cảm ơn bạn! Phản ánh đã được ghi nhận.</div>
</div>
<script>
let ctx = Object.fromEntries(new URLSearchParams(location.search));
window.addEventListener('message', e => { if (e.data && e.data.type === 'x24:context') ctx = Object.assign(ctx, e.data); });
let topic = 'Hạ tầng – Giao thông';
document.getElementById('topics').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#topics button').forEach(x => x.classList.toggle('on', x === b)); topic = b.textContent; };
document.getElementById('send').onclick = async () => {
  const content = document.getElementById('c').value;
  const r = await fetch('/api/modules/feedback/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ device: ctx.device, ward: ctx.ward, topic, content, contact: document.getElementById('ct').value }) });
  const d = await r.json();
  if (!r.ok) { alert(d.error); return; }
  document.getElementById('ok').style.display = 'block'; document.getElementById('c').value = '';
  parent.postMessage({ type: 'x24:track', module: 'feedback', data: { sent: 1 } }, '*');
  setTimeout(() => parent.postMessage({ type: 'x24:toast', text: 'Đã gửi phản ánh' }, '*'), 400);
};
</script></body></html>
