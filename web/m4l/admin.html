<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quản trị M4L · Maps for Life</title>
  <link rel="icon" href="/assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/m4l/m4l.css?v=6">
  <style>
    .admin-grid { display: grid; gap: 18px; grid-template-columns: 1fr; margin-top: 18px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
    .panel h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; }
    .status-active { color: var(--accent); font-weight: 700; }
    .status-inactive { color: var(--muted); font-weight: 700; }
    form.mood-form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 14px; }
    .admin-input { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text); padding: 8px 10px; width: 100%; }
    .poi-row { border-top: 1px solid var(--line); padding: 14px 0; }
    .poi-row h3 { margin: 0; font-size: .98rem; }
    .poi-row p { margin: 2px 0 8px; color: var(--muted); font-size: .8rem; }
    .mood-pick { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 8px; align-items: center; margin: 6px 0; }
    .mood-pick label { display: flex; gap: 8px; align-items: center; min-height: 44px; font-weight: 600; font-size: .88rem; }
    .mood-pick input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
    .muted { color: var(--muted); }
    .inline-form { display: flex; gap: 6px; margin-bottom: 6px; }
    .scroll-box { max-height: 360px; overflow: auto; }
    .change-list { margin: 8px 0; padding-left: 18px; font-size: .84rem; }
    details { margin-top: 10px; } summary { cursor: pointer; font-weight: 700; min-height: 32px; }
    textarea.admin-input { font-family: ui-monospace, monospace; font-size: .8rem; }
    .inline-form .admin-input { width: 90px; }
    .key-box { display: grid; gap: 6px; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #ffe08a; background: rgba(255, 224, 138, .1); }
    .key-box code { word-break: break-all; font-size: .85rem; user-select: all; }
    @media (min-width: 960px) { .admin-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); } .wide-panel { grid-column: 1 / -1; } }
    @media (max-width: 520px) { .mood-pick { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/m4l"><img src="/assets/logo.png" alt="Xanh24"><span>Maps for Life</span></a>
    <strong>Quản trị M4L</strong>
    <a class="account" id="who" href="/hrm/login?next=/m4l/admin">Đăng nhập</a>
  </div></header>
  <main id="view" class="view"><p class="muted">Đang kiểm tra quyền…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/m4l/admin.js?v=6"></script>
  <script type="module" src="/m4l/demo-mode.js"></script>
</body>
</html>
