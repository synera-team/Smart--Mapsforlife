<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Xanh24 - Maps for Life</title>
<meta name="description" content="Bản đồ số hành chính & dịch vụ công — tìm đường, xe buýt/metro, gọi xe, tham quan VR360.">
<meta name="theme-color" content="#14346F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="brand" id="brand" aria-label="Xanh24 - Maps for Life">
      <img src="/assets/logo.png" alt="Xanh24 - Maps for Life">
    </button>
    <div class="topbar-title" id="topTitle">
      <div class="tt-kicker" id="ttKicker">Bản đồ số</div>
      <div class="tt-main" id="ttMain">Thành phố Hà Nội</div>
    </div>
    <div class="searchbox" id="searchbox">
      <span class="sb-ic" data-icon="search"></span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Tìm địa điểm, cơ quan, phường…" aria-label="Tìm kiếm">
      <button class="sb-clear" id="qClear" aria-label="Xoá" hidden></button>
    </div>
    <div class="topbar-right">
      <div class="clock" id="clock"><b id="clockTime">--:--</b><span id="clockDate"></span></div>
      <button class="chip-btn lang" id="langBtn" aria-label="Ngôn ngữ">EN</button>
    </div>
  </header>

  <main class="stage">
    <aside class="panel" id="panel">
      <div class="sheet-handle" id="sheetHandle"><span></span></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>
    <section class="mapwrap">
      <div id="map" class="map"></div>
      <div class="map-ctrl" id="mapCtrl">
        <button class="mc" data-act="zin" aria-label="Phóng to"></button>
        <button class="mc" data-act="zout" aria-label="Thu nhỏ"></button>
        <button class="mc" data-act="here" aria-label="Vị trí của tôi"></button>
        <button class="mc" data-act="layers" aria-label="Lớp bản đồ"></button>
      </div>
      <div class="layer-pop" id="layerPop" hidden></div>
      <div class="map-badge" id="mapBadge" hidden></div>
    </section>
  </main>

  <footer class="footer" id="footer">
    <span id="copyright">Bản quyền thuộc về Công ty TNHH Công nghệ và Truyền thông Xanh24</span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="idle" id="idle" hidden>
  <div class="idle-stage" id="idleStage"></div>
  <div class="idle-top">
    <img src="/assets/logo.png" alt="Xanh24 - Maps for Life" class="idle-logo">
    <div class="idle-clock"><b id="idleTime">--:--</b><span id="idleDate"></span></div>
  </div>
  <div class="idle-bottom">
    <div class="idle-dots" id="idleDots"></div>
    <button class="idle-cta" id="idleCta">
      <span class="pulse"></span>
      <span class="idle-cta-ic" data-icon="touch"></span>
      <span class="idle-cta-text"><b id="idleCtaTitle">Chạm để mở Bản đồ</b><small id="idleCtaSub">Tìm địa điểm · Chỉ đường · Xe buýt & Metro · Gọi xe</small></span>
    </button>
    <div class="idle-quick" id="idleQuick"></div>
  </div>
  <div class="idle-foot" id="idleFoot"></div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="osk" id="osk" hidden></div>

<script src="/vendor/maplibre-gl.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
